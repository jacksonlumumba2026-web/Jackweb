<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwell Studio — Design Editor</title>
<style>
:root{--purple:#7657e8;--purple2:#6242d5;--ink:#242238;--muted:#77758b;--line:#e9e7f0;--panel:#fff;--bg:#f4f3f8;--shadow:0 8px 28px #30245b14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}.brand{font-weight:850;font-size:19px;letter-spacing:-.6px;margin-right:8px}.brand i{font-style:normal;color:var(--purple)}.docname{border:0;background:#f6f5fa;padding:8px 11px;border-radius:8px;width:min(240px,32vw);outline:0}.spacer{flex:1}.top button,.btn{padding:9px 13px;border-radius:9px;background:#f2f0f8;color:var(--ink);font-weight:650}.top .primary,.primary{background:var(--purple);color:white}.layout{display:grid;grid-template-columns:76px minmax(0,1fr) 280px;height:calc(100dvh - 58px)}.rail{background:#fff;border-right:1px solid var(--line);padding:10px 7px;display:flex;flex-direction:column;gap:5px}.tool{min-height:61px;border-radius:10px;background:transparent;color:#68647a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:650}.tool .ico{font-size:21px}.tool:hover,.tool.active{background:#f0edff;color:var(--purple)}.workspace{min-width:0;display:flex;flex-direction:column;overflow:hidden}.workbar{height:48px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:12px}.workbar button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--ink)}.stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:22px;min-height:0}.canvasWrap{position:relative;background:white;box-shadow:0 12px 38px #24203826;flex:none;touch-action:none}.canvasWrap canvas{display:block;width:100%;height:100%;touch-action:none}.canvasWrap .selection{position:absolute;border:1.5px solid var(--purple);pointer-events:none;display:none}.canvasWrap .selection:after{content:"";position:absolute;width:10px;height:10px;background:white;border:2px solid var(--purple);border-radius:50%;right:-6px;bottom:-6px}.right{background:#fff;border-left:1px solid var(--line);padding:16px;overflow:auto}.panelTitle{font-weight:800;font-size:15px;margin:0 0 13px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;color:#656176;margin-bottom:6px}.field input:not([type=color]),.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;color:var(--ink);outline-color:var(--purple)}.field textarea{min-height:82px;resize:vertical}.field input[type=color]{width:100%;height:38px;border:1px solid var(--line);background:white;border-radius:8px;padding:3px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actionrow{display:flex;gap:7px;flex-wrap:wrap}.actionrow button{flex:1;background:#f2f0f8;border-radius:8px;padding:9px;font-weight:650}.layers{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}.layer{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#fff}.layer.sel{border-color:var(--purple);background:#f7f5ff}.layer .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:12px}.layer button{background:transparent;color:#777;padding:3px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.mobileProps{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#27233a;color:#fff;padding:10px 16px;border-radius:99px;z-index:50;box-shadow:var(--shadow);display:none}.file{display:none}.emptyhint{color:#9692a4;text-align:center;max-width:240px}.emptyhint b{display:block;color:#605b72;font-size:15px;margin-bottom:6px}
@media(max-width:850px){.layout{grid-template-columns:64px minmax(0,1fr);height:calc(100dvh - 58px)}.right{display:none}.rail{padding:8px 4px}.tool{min-height:57px}.stage{padding:12px}.docname{width:115px}.mobileProps{display:block;position:fixed;bottom:10px;right:10px;z-index:12;background:var(--purple);color:white;border-radius:50px;padding:12px 16px;box-shadow:var(--shadow)}.right.open{display:block;position:fixed;z-index:20;right:0;top:58px;bottom:0;width:min(88vw,330px);box-shadow:-12px 0 30px #20183b25}.workbar{height:40px}}
@media(max-width:850px){.right.open{top:auto;left:64px;right:0;bottom:0;width:auto;max-height:72dvh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px 86px;box-shadow:0 -12px 30px #20183b25}.mobileProps{bottom:14px}.right.open:before{content:' ';display:block;width:42px;height:4px;border-radius:9px;background:#d8d5e2;margin:-7px auto 14px}}
@media(max-width:420px){.top{gap:6px;padding:0 8px}.brand{font-size:17px}.top button{padding:8px}.docname{width:88px}.tool{font-size:10px}.stage{padding:8px}}
/* Touch-first layout: also applies when Android Chrome is using Desktop site. */
@media (pointer:coarse) and (max-height:1200px){
  .top{height:54px;gap:6px;padding:0 8px}.brand{font-size:16px;margin-right:2px}.docname{width:min(112px,24vw);font-size:12px;padding:7px 6px}.top button{padding:8px 9px;font-size:12px}
  .layout{grid-template-columns:58px minmax(0,1fr);height:calc(100dvh - 54px)}
  .rail{padding:7px 4px;gap:3px}.tool{min-height:58px;font-size:10px}.tool .ico{font-size:19px}
  .right{display:none}.right.open{display:block;position:fixed;z-index:30;left:58px;right:0;top:auto;bottom:0;width:auto;max-height:min(68dvh,620px);overflow:auto;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px 90px;box-shadow:0 -12px 34px #20183b30;background:#fff}
  .right.open:before{content:"";display:block;width:44px;height:4px;border-radius:9px;background:#d8d5e2;margin:-7px auto 14px}
  .workspace{width:100%;min-width:0}.stage{padding:10px;overflow:auto;justify-content:center}.workbar{height:38px;flex:none}.workbar:last-child{font-size:10px;text-align:center;padding:0 8px}
  .mobileProps{display:block;position:fixed;z-index:25;right:12px;bottom:12px;padding:12px 16px;background:var(--purple);color:#fff;border-radius:30px;box-shadow:var(--shadow)}
  .field{margin:12px 0}.field label{font-size:13px}.field input:not([type=color]),.field select,.field textarea{font-size:16px;padding:11px}.actionrow button{min-height:42px}
}

</style></head>
<body>
<header class="top"><div class="brand">✦ <i>Inkwell</i> Studio</div><input id="docName" class="docname" value="Untitled design" aria-label="Design name"><button id="undo">↶</button><button id="redo">↷</button><div class="spacer"></div><button id="save">Save</button><button id="export" class="primary">Download</button></header>
<div class="layout">
<nav class="rail" aria-label="Design tools">
<button class="tool active" data-tool="select"><span class="ico">↖</span>Select</button>
<button class="tool" data-tool="text"><span class="ico">T</span>Text</button>
<button class="tool" data-tool="image"><span class="ico">▧</span>Photos</button>
<button class="tool" data-tool="shape"><span class="ico">◻</span>Elements</button>
<button class="tool" data-tool="background"><span class="ico">◉</span>Background</button>
<button class="tool" data-tool="fontphoto"><span class="ico">Aa</span>Font photo</button>
<button class="tool" data-tool="layers"><span class="ico">▤</span>Layers</button>
</nav>
<main class="workspace"><div class="workbar"><button id="zoomOut">−</button><span id="zoomLabel">Fit</span><button id="zoomIn">+</button><button id="resetView">Fit page</button></div><div class="stage" id="stage"><div class="canvasWrap" id="canvasWrap"><canvas id="design" width="1080" height="1350"></canvas><div class="selection" id="selection"></div></div></div><div class="workbar"><span>Tap Text to add lettering · Photos to upload · Elements for shapes · tap an object to edit it.</span></div></main>
<aside class="right" id="properties"><div id="propsContent"><h3 class="panelTitle">Design</h3><p class="hint">Start with text, a photo, or an element. Select anything on the canvas to edit its properties.</p><div class="field"><label>Page size</label><select id="pageSize"><option value="portrait">Portrait · 1080 × 1350</option><option value="square">Square · 1080 × 1080</option><option value="story">Story · 1080 × 1920</option><option value="landscape">Landscape · 1600 × 900</option></select></div><div class="field"><label>Canvas background</label><input id="pageBg" type="color" value="#ffffff"></div><div class="layers"><h3 class="panelTitle">Layers</h3><div id="layerList"><p class="hint">No objects yet.</p></div></div></div></aside>
</div>
<button class="mobileProps" id="mobileProps">Edit selected</button>
<input class="file" type="file" id="imageFile" accept="image/*"><input class="file" type="file" id="fontFile" accept="image/*">
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('design'),ctx=canvas.getContext('2d'),wrap=$('canvasWrap'),selection=$('selection'),stage=$('stage');
let objects=[],selected=null,tool='select',zoom=1,bg='#ffffff',history=[],future=[],drag=null,seq=1;
const fonts=['Arial','Georgia','Times New Roman','Verdana','Trebuchet MS','Caveat','Reenie Beanie','Homemade Apple','Courier New'];
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function snapshot(){history.push(JSON.stringify({objects,bg,w:canvas.width,h:canvas.height}));if(history.length>40)history.shift();future=[]}
function restore(data){const d=JSON.parse(data);objects=d.objects;bg=d.bg;canvas.width=d.w;canvas.height=d.h;selected=null;render();updateLayers();fit()}
function resizePage(w,h){snapshot();canvas.width=w;canvas.height=h;render();fit()}
function fit(){const maxW=Math.max(180,stage.clientWidth-36),maxH=Math.max(180,stage.clientHeight-36);zoom=Math.min(maxW/canvas.width,maxH/canvas.height,1);wrap.style.width=(canvas.width*zoom)+'px';wrap.style.height=(canvas.height*zoom)+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%';updateSelection()}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);for(const o of objects){ctx.save();ctx.globalAlpha=o.opacity??1;if(o.type==='text'){ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate((o.rotation||0)*Math.PI/180);ctx.fillStyle=o.color;ctx.textAlign=o.align||'left';ctx.textBaseline='middle';ctx.font=`${o.weight||400} ${o.size}px "${o.font}"`;const lines=(o.text||'').split('\n');const lineH=o.size*1.25;lines.forEach((line,i)=>{const x=o.align==='center'?0:o.align==='right'?o.w/2:-o.w/2,y=(i-(lines.length-1)/2)*lineH;if(o.strokeWidth){ctx.lineWidth=o.strokeWidth;ctx.strokeStyle=o.stroke||'#ffffff';ctx.lineJoin='round';ctx.strokeText(line,x,y)}ctx.fillText(line,x,y)});}
else if(o.type==='rect'||o.type==='circle'){ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate((o.rotation||0)*Math.PI/180);ctx.fillStyle=o.fill||'#7657e8';ctx.strokeStyle=o.stroke||'transparent';ctx.lineWidth=o.strokeWidth||0;if(o.type==='rect'){ctx.beginPath();ctx.roundRect(-o.w/2,-o.h/2,o.w,o.h,o.radius||0);ctx.fill();if(o.strokeWidth)ctx.stroke()}else{ctx.beginPath();ctx.ellipse(0,0,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();if(o.strokeWidth)ctx.stroke()}}
else if(o.type==='image'&&o.src){if(!o.img){o.img=new Image();o.img.onload=render;o.img.src=o.src}if(o.img.complete)ctx.drawImage(o.img,o.x,o.y,o.w,o.h)}ctx.restore()}
updateSelection()}
function bounds(o){return{x:o.x,y:o.y,w:o.w,h:o.h}}
function updateSelection(){if(!selected){selection.style.display='none';return}const o=objects.find(x=>x.id===selected);if(!o){selection.style.display='none';return}selection.style.display='block';selection.style.left=(o.x*zoom)+'px';selection.style.top=(o.y*zoom)+'px';selection.style.width=(o.w*zoom)+'px';selection.style.height=(o.h*zoom)+'px'}
function updateLayers(){const list=$('layerList');list.innerHTML='';if(!objects.length){list.innerHTML='<p class="hint">No objects yet.</p>';return}objects.slice().reverse().forEach(o=>{const row=document.createElement('div');row.className='layer'+(o.id===selected?' sel':'');const icon=o.type==='text'?'T':o.type==='image'?'▧':o.type==='circle'?'●':'◻';const name=o.type==='text'?(o.text||'Text').slice(0,24):o.type==='image'?'Photo':o.type==='circle'?'Circle':'Shape';row.innerHTML=`<span>${icon}</span><span class="name"></span><button title="Move up">↑</button><button title="Move down">↓</button><button title="Delete">×</button>`;row.querySelector('.name').textContent=name;row.onclick=e=>{if(e.target.tagName==='BUTTON')return;select(o.id);};const bs=row.querySelectorAll('button');bs[0].onclick=()=>moveLayer(o.id,1);bs[1].onclick=()=>moveLayer(o.id,-1);bs[2].onclick=()=>deleteObj(o.id);list.append(row)})}
function select(id){selected=id;const o=objects.find(x=>x.id===id);render();updateLayers();showProps(o);if(window.matchMedia('(max-width: 850px), (pointer:coarse) and (max-height:1200px)').matches){$('properties').classList.add('open');$('mobileProps').textContent='Close tools'}}
function newObj(o){snapshot();o.id='o'+seq++;objects.push(o);select(o.id)}
function addText(text='Your text here'){newObj({type:'text',text,x:130,y:160,w:820,h:150,size:76,font:'Arial',color:'#242238',weight:700,align:'center',rotation:0})}
function showProps(o){const p=$('propsContent');if(!o){p.innerHTML='<h3 class="panelTitle">Design</h3><p class="hint">Select an object to edit it, or use the left toolbar to add something.</p><div class="field"><label>Canvas background</label><input id="pageBg2" type="color" value="'+bg+'"></div><div class="layers"><h3 class="panelTitle">Layers</h3><div id="layerList"></div></div>';const x=$('pageBg2');x.oninput=()=>{bg=x.value;render()};return}
let html=`<div class="actionrow"><button id="duplicate">Duplicate</button><button id="delete">Delete</button></div><h3 class="panelTitle" style="margin-top:18px">${o.type==='text'?'Text settings':o.type==='image'?'Photo settings':'Element settings'}</h3>`;
if(o.type==='text')html+=`<div class="field"><label>Text</label><textarea id="objText"></textarea></div><div class="field"><label>Font family</label><select id="objFont">${fonts.map(f=>`<option>${f}</option>`).join('')}</select></div><div class="twocol"><div class="field"><label>Font size</label><input id="objSize" type="number" min="8" max="300" value="${o.size}"></div><div class="field"><label>Weight</label><select id="objWeight"><option value="400">Regular</option><option value="700">Bold</option><option value="800">Extra bold</option></select></div></div><div class="field"><label>Text colour</label><input id="objColor" type="color" value="${o.color}"></div><div class="field"><label>Outline colour</label><input id="objStroke" type="color" value="${o.stroke||'#ffffff'}"></div><div class="field"><label>Outline thickness</label><input id="objStrokeWidth" type="range" min="0" max="12" value="${o.strokeWidth||0}"></div><div class="field"><label>Alignment</label><select id="objAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div>`;
else html+=`<div class="field"><label>Fill colour</label><input id="objFill" type="color" value="${o.fill||'#7657e8'}"></div>`;
html+=`<div class="twocol"><div class="field"><label>Width</label><input id="objW" type="number" min="10" value="${Math.round(o.w)}"></div><div class="field"><label>Height</label><input id="objH" type="number" min="10" value="${Math.round(o.h)}"></div></div><div class="twocol"><div class="field"><label>X position</label><input id="objX" type="number" value="${Math.round(o.x)}"></div><div class="field"><label>Y position</label><input id="objY" type="number" value="${Math.round(o.y)}"></div></div><div class="field"><label>Rotation</label><input id="objRot" type="range" min="-180" max="180" value="${o.rotation||0}"></div><div class="field"><label>Transparency</label><input id="objOpacity" type="range" min="0.1" max="1" step="0.05" value="${o.opacity??1}"></div><div class="actionrow"><button id="front">Bring forward</button><button id="back">Send backward</button></div><div class="layers"><h3 class="panelTitle">Layers</h3><div id="layerList"></div></div>`;p.innerHTML=html;
const bind=(id,key,parse=v=>v)=>{const el=$(id);if(el)el.oninput=()=>{o[key]=parse(el.value);render();updateLayers()}};
if(o.type==='text'){const t=$('objText');t.value=o.text;t.oninput=()=>{o.text=t.value;render();updateLayers()};const f=$('objFont');f.value=o.font;f.onchange=()=>{o.font=f.value;render()};bind('objSize','size',Number);bind('objWeight','weight',Number);bind('objColor','color');bind('objStroke','stroke');bind('objStrokeWidth','strokeWidth',Number);bind('objAlign','align')}
else bind('objFill','fill');bind('objW','w',Number);bind('objH','h',Number);bind('objX','x',Number);bind('objY','y',Number);bind('objRot','rotation',Number);bind('objOpacity','opacity',Number);
$('duplicate').onclick=()=>{const c={...o,id:undefined,x:o.x+28,y:o.y+28,img:undefined};newObj(c)};$('delete').onclick=()=>deleteObj(o.id);$('front').onclick=()=>moveLayer(o.id,1);$('back').onclick=()=>moveLayer(o.id,-1);updateLayers()}
function deleteObj(id){snapshot();objects=objects.filter(o=>o.id!==id);selected=null;render();updateLayers();showProps(null)}function moveLayer(id,d){snapshot();const i=objects.findIndex(o=>o.id===id),j=Math.max(0,Math.min(objects.length-1,i+d));if(i<0||i===j)return;const [o]=objects.splice(i,1);objects.splice(j,0,o);render();updateLayers()}
function pointer(e){const r=wrap.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom}}
function hit(p){for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(p.x>=o.x&&p.x<=o.x+o.w&&p.y>=o.y&&p.y<=o.y+o.h)return o}return null}
wrap.addEventListener('pointerdown',e=>{const p=pointer(e);if(tool==='select'){const o=hit(p);if(o){select(o.id);const nearCorner=p.x>o.x+o.w-24&&p.y>o.y+o.h-24;snapshot();drag={id:o.id,start:p,ox:o.x,oy:o.y,ow:o.w,oh:o.h,resize:nearCorner};wrap.setPointerCapture(e.pointerId)}else{selected=null;render();updateLayers();showProps(null)}}});wrap.addEventListener('pointermove',e=>{if(!drag)return;const p=pointer(e),o=objects.find(x=>x.id===drag.id);if(!o)return;if(drag.resize){o.w=Math.max(20,drag.ow+p.x-drag.start.x);o.h=Math.max(20,drag.oh+p.y-drag.start.y)}else{o.x=drag.ox+p.x-drag.start.x;o.y=drag.oy+p.y-drag.start.y}render()});['pointerup','pointercancel'].forEach(n=>wrap.addEventListener(n,()=>{if(drag){drag=null;showProps(objects.find(x=>x.id===selected))}}));
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(t==='text'){addText();tool='select';document.querySelector('[data-tool="select"]').classList.add('active')}if(t==='image')$('imageFile').click();if(t==='shape'){const type=confirm('Add a circle? Choose Cancel for a rectangle.')?'circle':'rect';newObj({type,x:300,y:350,w:360,h:260,fill:'#8c72ed',rotation:0})}if(t==='background'){const c=prompt('Enter a background colour (for example #fff4e6):',bg);if(c&&/^#[0-9a-f]{6}$/i.test(c)){snapshot();bg=c;render()}}if(t==='fontphoto'){$('fontFile').click()}if(t==='layers'){$('properties').classList.add('open');$('layerList')?.scrollIntoView({behavior:'smooth',block:'center'})}}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('imageFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});const im=new Image();im.onload=()=>{const scale=Math.min(700/im.width,600/im.height,1);newObj({type:'image',src,x:190,y:230,w:im.width*scale,h:im.height*scale,rotation:0,opacity:1,img:im});toast('Photo added. Drag to position and resize from the corner.')};im.src=src};
$('fontFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f){toast('Sample added to the page. Select it to resize or position it; automatic font extraction is not enabled yet.');const r=new FileReader();r.onload=()=>newObj({type:'image',src:r.result,x:180,y:260,w:720,h:480,rotation:0});r.readAsDataURL(f)}};
$('pageBg').oninput=e=>{bg=e.target.value;render()};$('pageSize').onchange=e=>{const dims={portrait:[1080,1350],square:[1080,1080],story:[1080,1920],landscape:[1600,900]}[e.target.value];resizePage(...dims)};
$('zoomIn').onclick=()=>{zoom=Math.min(2,zoom*1.15);wrap.style.width=canvas.width*zoom+'px';wrap.style.height=canvas.height*zoom+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%'};$('zoomOut').onclick=()=>{zoom=Math.max(.15,zoom/1.15);wrap.style.width=canvas.width*zoom+'px';wrap.style.height=canvas.height*zoom+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%'};$('resetView').onclick=fit;addEventListener('resize',fit);
$('undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify({objects,bg,w:canvas.width,h:canvas.height}));restore(history.pop())};$('redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify({objects,bg,w:canvas.width,h:canvas.height}));restore(future.pop())};
$('save').onclick=()=>{try{localStorage.setItem('inkwell-studio-project',JSON.stringify({objects:objects.map(({img,...o})=>o),bg,w:canvas.width,h:canvas.height,name:$('docName').value}));toast('Design saved on this device.')}catch(e){toast('Could not save. Try using fewer or smaller photos.')}};
$('export').onclick=()=>{render();const a=document.createElement('a');a.download=($('docName').value.trim()||'inkwell-design').replace(/[^a-z0-9-_]+/gi,'-')+'.png';a.href=canvas.toDataURL('image/png');a.click();toast('PNG download started.')};$('mobileProps').onclick=()=>{const panel=$('properties');panel.classList.toggle('open');$('mobileProps').textContent=panel.classList.contains('open')?'Close tools':'Edit selected'};
// Load last locally saved design if available.
